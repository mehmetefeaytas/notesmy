name: 🚀 Build · Release · Homebrew

# ─────────────────────────────────────────────────────────────
# Trigger: v* tag push (e.g. git tag v1.6.0 && git push --tags)
#          OR manual via GitHub UI (workflow_dispatch)
# ─────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.6.0 — WITHOUT the v prefix)'
        required: true
        default: '1.5.0'
      release_notes:
        description: 'Release notes (optional, leave blank for auto)'
        required: false
        default: ''

permissions:
  contents: write   # create GitHub Releases, upload assets
  actions: read

# ─────────────────────────────────────────────────────────────
# JOB 1 — Tests
# ─────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🧪 Swift Tests
    runs-on: macos-15         # Apple Silicon runner (M1), Xcode 15+
    timeout-minutes: 15
    # Enforce: Strictly maintainer-only release execution
    if: github.repository_owner == 'mehmetefeaytas' && (github.actor == 'mehmetefeaytas' || github.event_name == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Swift Build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Tests
        run: swift test --parallel 2>&1

# ─────────────────────────────────────────────────────────────
# JOB 2 — Build, Package, Release, Update Homebrew Tap
# ─────────────────────────────────────────────────────────────
  release:
    name: 📦 Build & Release
    runs-on: macos-15
    needs: test
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}
      sha256:  ${{ steps.checksum.outputs.sha256 }}
      dmg:     ${{ steps.checksum.outputs.dmg }}

    steps:
      # ── 1. Source ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for changelog generation

      # ── 2. Version metadata ──────────────────────────────────
      - name: Extract version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
            TAG="v${VER}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"     >> $GITHUB_OUTPUT
          echo "📌 Version: ${VER}  Tag: ${TAG}"

      # ── 3. Patch version in Info.plist ───────────────────────
      - name: Patch Info.plist version
        run: |
          VER="${{ steps.meta.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VER}"            Resources/Info.plist
          echo "✅ Info.plist patched to ${VER}"

      # ── 4. Patch package_dmg.sh version ─────────────────────
      - name: Patch package_dmg.sh version
        run: |
          VER="${{ steps.meta.outputs.version }}"
          sed -i '' "s/^VERSION=.*/VERSION=\"${VER}\"/" package_dmg.sh
          echo "✅ package_dmg.sh patched to ${VER}"

      # ── 5. Select Xcode ──────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ── 6. Restore SPM cache ─────────────────────────────────
      - name: Cache Swift Build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── 7. Build Universal Binary + Create DMG ───────────────
      - name: Build & Package DMG
        run: |
          chmod +x package_dmg.sh
          bash package_dmg.sh
          echo "📦 Files created:"
          ls -lh NotesMy*.dmg NotesMy.zip

      # ── 8. Ad-hoc codesign (unsigned — users may see Gatekeeper prompt) ─
      #       For production: replace with Developer ID signing + notarize
      #       See SIGNING.md for full notarization setup.
      - name: Verify code signature
        run: |
          codesign --verify --verbose NotesMy.app
          spctl --assess --type execute NotesMy.app 2>&1 || true
          echo "ℹ️  Ad-hoc signed (no Developer ID). See SIGNING.md for notarization."

      # ── 9. SHA-256 checksum ──────────────────────────────────
      - name: Compute SHA-256
        id: checksum
        run: |
          VER="${{ steps.meta.outputs.version }}"
          DMG="NotesMy-${VER}.dmg"
          SHA=$(shasum -a 256 "${DMG}" | awk '{print $1}')
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT
          echo "dmg=${DMG}"   >> $GITHUB_OUTPUT
          echo "🔑 SHA256: ${SHA}"

      # ── 10. Generate changelog from git log ──────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log ${PREV}..HEAD --pretty=format:"- %s (%h)" --no-merges | head -30)
          else
            LOG="Initial release"
          fi
          # Escape for GitHub Actions multiline output
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "log<<${EOF}" >> $GITHUB_OUTPUT
          echo "${LOG}"      >> $GITHUB_OUTPUT
          echo "${EOF}"      >> $GITHUB_OUTPUT

      # ── 11. Create / update GitHub Release ───────────────────
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       "NotesMy ${{ steps.meta.outputs.tag }}"
          draft:      false
          prerelease: false
          files: |
            NotesMy-${{ steps.meta.outputs.version }}.dmg
            NotesMy.dmg
            NotesMy.zip
          body: |
            ## NotesMy ${{ steps.meta.outputs.tag }} 🚀

            ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || steps.changelog.outputs.log }}

            ---

            ### ⚡ Install via Homebrew (recommended)
            ```bash
            brew install --cask mehmetefeaytas/tap/notesmy
            ```

            ### 📥 Direct Download
            Download **NotesMy-${{ steps.meta.outputs.version }}.dmg** below, open it, drag NotesMy.app → Applications.

            > ⚠️ **Gatekeeper note:** This build is ad-hoc signed (no Apple notarization yet).  
            > If macOS blocks it: **right-click → Open → Open** once to allow permanently.

            ### 🔑 SHA-256
            ```
            ${{ steps.checksum.outputs.sha256 }}
            ```

            ### Upgrade
            ```bash
            brew upgrade --cask notesmy
            ```

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Update Homebrew Tap (separate job = clean env)
  # ─────────────────────────────────────────────────────────────
  update-tap:
    name: 🍺 Update Homebrew Tap
    runs-on: ubuntu-latest    # linux is faster + cheaper for git ops
    needs: release
    timeout-minutes: 10

    steps:
      - name: Update Casks/notesmy.rb in homebrew-tap
        env:
          # Create a PAT at: Settings → Developer settings → Personal access tokens → Fine-grained
          # Grant it: Contents (read+write) on the homebrew-tap repo.
          # Store as repository secret: TAP_GITHUB_TOKEN
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION:   ${{ needs.release.outputs.version }}
          SHA256:    ${{ needs.release.outputs.sha256 }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/mehmetefeaytas/homebrew-tap.git" \
            tap-repo

          cd tap-repo
          mkdir -p Casks

          # Write cask file using printf (avoids heredoc YAML conflicts)
          printf 'cask "notesmy" do\n' > Casks/notesmy.rb
          printf '  version "%s"\n' "${VERSION}" >> Casks/notesmy.rb
          printf '  sha256 "%s"\n' "${SHA256}" >> Casks/notesmy.rb
          printf '\n' >> Casks/notesmy.rb
          printf '  url "https://github.com/mehmetefeaytas/notesmy/releases/download/v#{version}/NotesMy-#{version}.dmg"\n' >> Casks/notesmy.rb
          printf '  name "NotesMy"\n' >> Casks/notesmy.rb
          printf '  desc "Smart notes with AI Second Brain, Knowledge Graph, iCloud Sync & Voice Transcription for macOS"\n' >> Casks/notesmy.rb
          printf '  homepage "https://github.com/mehmetefeaytas/notesmy"\n' >> Casks/notesmy.rb
          printf '\n' >> Casks/notesmy.rb
          printf '  auto_updates true\n' >> Casks/notesmy.rb
          printf '  depends_on macos: :ventura\n' >> Casks/notesmy.rb
          printf '\n' >> Casks/notesmy.rb
          printf '  app "NotesMy.app"\n' >> Casks/notesmy.rb
          printf '\n' >> Casks/notesmy.rb
          printf '  uninstall quit: "app.notesmy.mac"\n' >> Casks/notesmy.rb
          printf '\n' >> Casks/notesmy.rb
          printf '  zap trash: [\n' >> Casks/notesmy.rb
          printf '    "~/Library/Application Support/NotesMy",\n' >> Casks/notesmy.rb
          printf '    "~/Library/Preferences/app.notesmy.mac.plist",\n' >> Casks/notesmy.rb
          printf '    "~/Library/Caches/app.notesmy.mac",\n' >> Casks/notesmy.rb
          printf '  ]\n' >> Casks/notesmy.rb
          printf 'end\n' >> Casks/notesmy.rb

          echo "--- Generated Casks/notesmy.rb ---"
          cat Casks/notesmy.rb

          git add Casks/notesmy.rb
          git diff --cached --quiet && echo "No changes — cask already up to date." && exit 0
          git commit -m "chore: bump notesmy to v${VERSION}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/mehmetefeaytas/homebrew-tap.git" main
          echo "✅ homebrew-tap updated to v${VERSION}"
