name: 🤖 Stale Issues & PRs

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >
            Bu konu son 60 gündür aktif değil. 7 gün içinde yeni bir aktivite olmazsa otomatik olarak kapatılacaktır. /
            This issue has been automatically marked as stale because it has not had recent activity for 60 days. It will be closed in 7 days if no further activity occurs.
          stale-pr-message: >
            Bu çekme isteği (PR) son 60 gündür aktif değil. 7 gün içinde güncellenmezse otomatik olarak kapatılacaktır. /
            This PR has been automatically marked as stale because it has not had recent activity for 60 days. It will be closed in 7 days if no further activity occurs.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,enhancement,keep'
          exempt-pr-labels: 'pinned,security,wip,keep'
